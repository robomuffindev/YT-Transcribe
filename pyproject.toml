[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-yt-transcriber"
version = "1.1.0"
description = "A local desktop app for downloading YouTube videos and creating AI-ready transcripts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Robomuffin Labs" }]
keywords = ["youtube", "transcription", "whisper", "faster-whisper", "cuda", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper==1.2.1",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.35",
  "yt-dlp[default]>=2025.1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[project.gui-scripts]
yt-transcriber = "yt_transcriber.ui:main"

[tool.setuptools.packages.find]
include = ["yt_transcriber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
